<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — Accident Management</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap"/>
  <style>
    body {
      background: linear-gradient(135deg, #1a237e, #161d4c);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Sarabun', sans-serif;
    }
    .login-card {
      background: #fff; border-radius: 16px;
      padding: 2.5rem 2.5rem; width: 100%; max-width: 520px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .login-card h1 { font-size: 1.4rem; font-weight: 700; color: #1a237e; }
    @media (max-width: 480px) {
      .login-card { padding: 2rem 1.25rem; border-radius: 12px; }
    }
  </style>
</head>
<body>
<div class="px-3 py-4 d-flex align-items-center justify-content-center" style="min-height:100vh">
<div class="login-card">
  <div class="text-center mb-4">
    <span style="font-size:2.5rem;">🛡️</span>
    <h1 class="mt-2">Accident Management</h1>
    <p class="text-muted" style="font-size:.9rem;">กรุณา Login เพื่อเข้าใช้งาน Admin</p>
  </div>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} d-flex align-items-center gap-2 rounded-3 py-2 px-3" role="alert" style="font-size:.9rem;border-left:4px solid">
        <span>
          {% if cat == 'danger' %}⚠️{% elif cat == 'success' %}✅{% elif cat == 'warning' %}⚡{% else %}ℹ️{% endif %}
        </span>
        <span>{{ msg }}</span>
      </div>
    {% endfor %}
  {% endwith %}
  <form method="POST">
    <div class="mb-3">
      <label class="form-label fw-semibold">ชื่อผู้ใช้</label>
      <input type="text" name="username" class="form-control" required autofocus/>
    </div>
    <div class="mb-4">
      <label class="form-label fw-semibold">รหัสผ่าน</label>
      <input type="password" name="password" class="form-control" required/>
    </div>
    <button type="submit" class="btn w-100"
      style="background:linear-gradient(135deg,#1a237e,#3949ab);color:#fff;font-weight:600;">
      เข้าสู่ระบบ
    </button>
  </form>
</div><!-- login-card -->
</div><!-- wrapper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
