<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>iframe Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #ddd; padding: 20px; font-family: sans-serif; }
    h2 { font-size: 0.9rem; color: #555; margin-bottom: 10px; }
    iframe { width: 100%; height: 950px; border: none; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.15); background: white; }
  </style>
</head>
<body>
  <h2>iframe Preview — http://127.0.0.1:5000/embed</h2>
  <iframe src="/embed" scrolling="auto"></iframe>
</body>
</html>
